text_sensor:
  - platform: template
    name: Product Info
    entity_category: diagnostic
    lambda: return id(dreo_hub).product();
    update_interval: 10s

  - platform: template
    name: MCU Version Info
    entity_category: diagnostic
    lambda: return id(dreo_hub).mcu_version();
    update_interval: 10s

  - platform: template
    name: MCU Firmware Version
    # Parsed from Product Info: "004+CMS32/GL+2.1.39" -> "2.1.39".
    lambda: |-
      std::string p = id(dreo_hub).product();
      auto last = p.rfind('+');
      if (last == std::string::npos)
        return std::string("");
      return p.substr(last + 1);
    update_interval: 10s

  - platform: template
    name: MCU Hardware Model
    # Parsed from Product Info: "004+CMS32/GL+2.1.39" -> "CMS32/GL".
    lambda: |-
      std::string p = id(dreo_hub).product();
      auto first = p.find('+');
      auto last = p.rfind('+');
      if (first == std::string::npos || last == first)
        return std::string("");
      return p.substr(first + 1, last - first - 1);
    update_interval: 10s

  - platform: template
    name: Last MCU Status
    entity_category: diagnostic
    internal: ${debug_entities_internal}
    lambda: return id(dreo_hub).last_status();
    update_interval: 5s

  - platform: template
