  - platform: dreo
    id: current_temperature
    name: Current Temperature
    sensor_datapoint: 24
    device_class: temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    # DP24 is reported by the MCU in °F; convert to °C.
    filters:
      - lambda: return (x - 32.0) * 5.0 / 9.0;

