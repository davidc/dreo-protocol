select:
  - platform: template
    name: RGB Stock Preset
    entity_category: config
    internal: true
    update_interval: 5s
    options:
      - "Off"
      - "Preset 0"
      - "Preset 1"
      - "Preset 2"
      - "Preset 3"
      - "Preset 4"
    lambda: |-
      auto on = id(dreo_hub).bool_state(5);
      if (on.has_value() && !on.value())
        return std::string("Off");
      auto preset = id(dreo_hub).number_state(25);
      if (!preset.has_value())
        return {};
      int value = (int) preset.value();
      if (value < 0)
        value = 0;
      if (value > 4)
        value = 4;
      char name[16];
      snprintf(name, sizeof(name), "Preset %d", value);
      return std::string(name);
    set_action:
      - lambda: |-
          id(rgb_manual_mode) = false;
          if (x == "Off") {
            id(dreo_hub).set_boolean_datapoint_value(5, false);
            id(dreo_hub).set_integer_datapoint_value(25, 0);
            return;
          }
          id(dreo_hub).set_boolean_datapoint_value(5, true);
          if (id(atm_brightness) <= 0)
            id(atm_brightness) = 63;
          int value = 0;
          if (x == "Preset 1")
            value = 1;
          else if (x == "Preset 2")
            value = 2;
          else if (x == "Preset 3")
            value = 3;
          else if (x == "Preset 4")
            value = 4;
          id(dreo_hub).set_integer_datapoint_value(25, value);

